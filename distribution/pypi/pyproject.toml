[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bootstrap-cli"
version = "0.3.0"
description = "Thin launcher for the Cli developer bootstrap platform (github.com/intruder0007/Cli) — downloads and runs the real bootstrap binary for your platform."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.urls]
Repository = "https://github.com/intruder0007/Cli"

[project.scripts]
bootstrap = "bootstrap_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
