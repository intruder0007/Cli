[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumo-cli"
version = "1.0.0"
description = "Thin launcher for the Lumo project scaffolding platform (github.com/intruder0007/Lumo) — downloads and runs the real lumo binary for your platform."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.urls]
Repository = "https://github.com/intruder0007/Lumo"

[project.scripts]
lumo = "lumo_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
