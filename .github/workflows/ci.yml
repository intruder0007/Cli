name: CI

on:
  pull_request:
    branches: [main, architecture, cli, core, templates, plugins, sdk, tests]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # tests/integration's TestEndToEndGenerateNodeRestAPI needs a real
      # node/npm on PATH — explicit rather than relying on whatever
      # ubuntu-latest happens to ship, so a runner-image change can't
      # silently start skipping the cross-language proof.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # tests/integration exercises the git-init capability plugin,
      # which runs `git commit`; a fresh runner has no git identity
      # configured (developer machines usually already have one, so
      # this only ever surfaces in CI).
      - name: Configure git identity for the integration test
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # go.work only exists once the cli branch has merged; guard so PRs
      # against earlier branches (architecture/sdk/core/...) don't fail
      # trying to build modules that aren't present yet.
      - name: Build & vet present modules
        run: |
          for m in cli core sdk/go templates/go-rest-api templates/node-rest-api \
                   plugins/builtin/git-init plugins/builtin/readme plugins/builtin/github-actions-ci \
                   tests; do
            if [ -f "$m/go.mod" ]; then
              echo "== $m =="
              (cd "$m" && go build ./... && go vet ./...)
            fi
          done

      - name: Test present modules
        run: |
          for m in cli core sdk/go templates/go-rest-api templates/node-rest-api \
                   plugins/builtin/git-init plugins/builtin/readme plugins/builtin/github-actions-ci \
                   tests; do
            if [ -f "$m/go.mod" ]; then
              echo "== $m =="
              (cd "$m" && go test ./...)
            fi
          done
